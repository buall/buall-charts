{{/* vim: set filetype=mustache: */}}

{{/*
Create the ConfigMap mounted at /docker-entrypoint-initdb.d/.
*/}}
{{- if or .Values.initdbScripts .Values.postgresql.extensions }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postgresql.initdbScriptsConfigMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
data:
  {{- if .Values.postgresql.extensions }}
  00-extensions.sql: |
    {{- include "postgresql.extensionInitScript" . | nindent 4 }}
  {{- end }}
  {{- range $name, $script := .Values.initdbScripts }}
  {{ $name }}: |
    {{- $script | nindent 4 }}
  {{- end }}
{{- end }}
