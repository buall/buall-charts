name: Release Charts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate charts
        run: ./scripts/test.sh

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release charts
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          packages_with_index: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out chart repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .chart-repository

      - name: Publish Artifact Hub repository metadata
        run: |
          cp artifacthub-repo.yml .chart-repository/artifacthub-repo.yml
          touch .chart-repository/.nojekyll
          git -C .chart-repository config user.name "github-actions[bot]"
          git -C .chart-repository config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .chart-repository add artifacthub-repo.yml .nojekyll
          if git -C .chart-repository diff --cached --quiet; then
            exit 0
          fi
          git -C .chart-repository commit -m "Publish Artifact Hub repository metadata"
          git -C .chart-repository push origin HEAD:gh-pages
