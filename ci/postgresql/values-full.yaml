global:
  imageRegistry: registry.example.com
  storageClass: standard
auth:
  username: app
  password: test-password
  database: app
image:
  registry: docker.io
  tag: "16.4"
persistence:
  size: 10Gi
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
postgresql:
  configuration: |
    max_connections = 200
  pgHbaConfiguration: |
    local all all trust
    host all all 127.0.0.1/32 scram-sha-256
initdbScripts:
  01-init.sql: |
    CREATE EXTENSION IF NOT EXISTS pg_trgm;
nodeSelector:
  kubernetes.io/os: linux
tolerations:
  - key: dedicated
    operator: Equal
    value: database
    effect: NoSchedule
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: postgresql

